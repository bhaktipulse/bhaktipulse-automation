name: BhaktiPulse Daily Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 17 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Telugu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Verify Telugu font
        run: |
          fc-match "Noto Sans Telugu"
          fc-match ":lang=te"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Piper installation
        run: |
          piper --help

      - name: Test Piper Telugu voice
        run: |
          mkdir -p output
          echo "నమస్కారం. ఓం నమః శివాయ." | \
            piper \
            --model te_IN-maya-medium \
            --output_file output/piper_test.wav

          test -s output/piper_test.wav

      - name: Run automation test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TEST_ONLY: "true"
        run: |
          python main.py

      - name: Upload generated test video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bhaktipulse-test-video
          path: output/devotional.mp4
          if-no-files-found: error
